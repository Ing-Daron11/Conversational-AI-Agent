version: '3.8'

# ============================================================
# Docker Compose — FASE 6 (actualizado)
# Cuatro servicios: backend (FastAPI), frontend (Next.js),
# base de datos (PostgreSQL) y caché (Redis).
#
# CONCEPTO — Redes Docker:
#   Los servicios en el mismo docker-compose se comunican por
#   nombre de servicio (ej: "backend" resuelve a la IP del contenedor).
#   El frontend llama a http://backend:8000 dentro de Docker.
#   El navegador del usuario llama a http://localhost:8000 (port mapping).
# ============================================================

services:

  # ---------- Servicio principal: API FastAPI ----------
  backend:
    build: ./backend
    container_name: asistente-backend
    ports:
      - "8000:8000"           # FastAPI accesible en localhost:8000
    env_file:
      - .env                  # carga todas las variables de entorno
    depends_on:
      db:
        condition: service_healthy   # espera a que Postgres esté listo
      redis:
        condition: service_healthy   # espera a que Redis esté listo
    volumes:
      - ./backend:/app        # hot-reload: cambios locales se reflejan al instante
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------- Panel de administración: Next.js (FASE 6) ----------
  # Interfaz web para gestionar documentos, ver métricas y eventos.
  #
  # CONCEPTO — NEXT_PUBLIC_API_URL:
  #   En el NAVEGADOR, las llamadas deben ir a localhost:8000 (accesible desde el host).
  #   Dentro de Next.js SSR (servidor), podría usar http://backend:8000.
  #   Como usamos Client Components para la mayoría de fetches, usamos localhost:8000.
  frontend:
    build: ./frontend
    container_name: asistente-frontend
    ports:
      - "3000:3000"           # Next.js accesible en localhost:3000
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000   # URL pública (navegador → backend)
      - WATCHPACK_POLLING=true                       # hot reload en Docker/Windows
    depends_on:
      - backend
    volumes:
      - ./frontend:/app                             # montar código para hot reload
      - /app/node_modules                           # excluir node_modules del mount

  # ---------- Base de datos relacional: PostgreSQL 15 ----------
  # Almacena: citas, usuarios, historial de conversaciones (FASE 2+)
  db:
    image: postgres:15
    container_name: asistente-db
    environment:
      POSTGRES_USER: asistente
      POSTGRES_PASSWORD: asistente123
      POSTGRES_DB: asistente_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persiste los datos entre reinicios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistente -d asistente_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Caché en memoria: Redis 7 ----------
  # Almacena: sesiones de conversación activas, rate limiting (FASE 2+)
  redis:
    image: redis:7-alpine
    container_name: asistente-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:   # volumen nombrado: sobrevive a "docker compose down"
